<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Импорт данных</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
        }
        input[type="file"] {
            display: block;
            margin-top: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .alert {
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            color: white;
        }
        .alert.success {
            background-color: #28a745;
        }
        .alert.error {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
<h1>Welcome, <span th:text="${username}" id="userName">User</span>!</h1>
<div class="container">
    <h1>Импорт коллекций</h1>
    <form method="POST" th:action="@{/import/upload}" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file">Выберите файл (только XLSX):</label>
            <input type="file" id="file" name="file" accept=".xlsx" required>
        </div>
        <button type="submit">Загрузить файл</button>
    </form>

    <div th:if="${message}" class="alert" th:classappend="${success} ? 'success' : 'error'">
        <p th:text="${message}"></p>
    </div>
</div>
</body>
</html>
