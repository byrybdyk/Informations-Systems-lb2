<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История импорта</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .table-container {
            width: 100%;
            max-height: 400px;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .pagination button {
            padding: 5px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .pagination button:hover {
            background-color: #0056b3;
        }

        .pagination span {
            padding: 8px;
            font-weight: bold;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container2 {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
        }
        input[type="file"] {
            display: block;
            margin-top: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .alert {
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            color: white;
        }
        .alert.success {
            background-color: #28a745;
        }
        .alert.error {
            background-color: #dc3545;
        }
    </style>

    <script th:inline="javascript">
        let historyData = /*[[${history}]]*/ [];
        const pageSize = 5;
        let currentPage = 1;
        let totalPages = 1;

        function renderTable(page) {
            totalPages = Math.ceil(historyData.length / pageSize);
            const tableBody = document.getElementById('historyTableBody');
            tableBody.innerHTML = "";
            const start = (page - 1) * pageSize;
            const end = start + pageSize;
            const paginatedItems = historyData.slice(start, end);

            paginatedItems.forEach(entry => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${entry.id}</td>
                <td>${entry.isSuccessful ? 'Успешно' : 'Неудачно'}</td>
                <td>${entry.user.username}</td>
                <td>${entry.addedObjectsCount}</td>
                <td>${formatDate(entry.creationDate)}</td>
                <td>
                        ${entry.isSuccessful
                    ? `<a href="javascript:void(0);" onclick="downloadFile('${entry.uuid}')">Скачать</a>`
                    : ''        }
                </td>
                `;
                tableBody.appendChild(row);
            });


            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('totalPages').textContent = totalPages;
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderTable(currentPage);
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable(currentPage);
            }
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        function downloadFile(uuid) {
            window.location.href = '/import/download/' + uuid;
        }

        window.onload = function () {
            renderTable(currentPage);
        };
    </script>
</head>
<body>

<h1>Welcome, <span th:text="${username}" id="userName">User</span>!</h1>
<div class="container2">
    <h1>Импорт коллекций</h1>
    <form method="POST" th:action="@{/import/upload}" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file">Выберите файл (только XLSX):</label>
            <input type="file" id="file" name="file" accept=".xlsx" required>
        </div>
        <button type="submit">Загрузить файл</button>
    </form>

    <div th:if="${message}" class="alert" th:classappend="${success} ? 'success' : 'error'">
        <p th:text="${message}"></p>
    </div>
</div>
<div class="container">
    <h1>История импорта</h1>
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Статус</th>
                <th>Пользователь</th>
                <th>Число добавленных объектов</th>
                <th>Дата и время</th>
                <th>Файл</th>
            </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button onclick="previousPage()">Предыдущая</button>
        <span id="currentPage">1</span> / <span id="totalPages">1</span>
        <button onclick="nextPage()">Следующая</button>
    </div>
</div>

</body>
</html>
